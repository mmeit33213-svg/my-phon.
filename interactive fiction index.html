<script>
/* ============================================================
   PHONE RUNTIME  (이 함수는 독자용 HTML에 그대로 복사됩니다)
   ============================================================ */
function mountPhone(root,initial){
  let cfg=initial;
  const fresh=()=>({screen:'lock',pin:'',tab:'home',stack:[],story:null,seen:{},liked:{},saved:{},unr:{},extra:{},typing:null,ri:{},fol:{},bump:{},lastKey:'',scr:{},taps:{},q:'',anim:false,shake:false,hold:0,sl:false,cm:{},mem:null,mm:null,sx:{},sri:{},smo:null,smty:null,zoom:null,auto:false,pre:{},sc:{}});
  let S=fresh();
  root.classList.add('ps');
  root.innerHTML='<div class="cnt"></div><div class="tl"></div>';
  const C=root.querySelector('.cnt'),TL=root.querySelector('.tl');
  const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const bc=new Map();
  const U=s=>{if(!s)return'';if(s.slice(0,5)!=='data:'||s.indexOf(';base64,')<0)return s;let u=bc.get(s);if(!u){try{const i=s.indexOf(','),b=atob(s.slice(i+1)),n=b.length,a=new Uint8Array(n);for(let k=0;k<n;k++)a[k]=b.charCodeAt(k);u=URL.createObjectURL(new Blob([a],{type:s.slice(5,s.indexOf(';'))}))}catch(e){u=s}bc.set(s,u)}return u};
  const P={pluscir:'<circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v9M7.5 12h9"/>',plus:'<path d="M12 4v16M4 12h16"/>',badge:'<rect x="4.5" y="2.5" width="15" height="19" rx="3.5"/><path d="m12 7.5 1.4 2.8 3 .4-2.2 2.1.5 3-2.7-1.4-2.7 1.4.5-3-2.2-2.1 3-.4z" fill="currentColor"/>',menu:'<path d="M5 8h14M9 12h10M13 16h6"/>',edit:'<path d="M11 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5V13"/><path d="M18.6 3.6a2.1 2.1 0 0 1 3 3L12 16l-4 1 1-4z"/>',
    home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    reels:'<rect x="3" y="3" width="18" height="18" rx="4.5"/><path d="M3 8.5h18M8.5 3 11 8.5M14 3l2.5 5.5"/><path d="m10.2 12.2 4.6 2.7-4.6 2.7z" fill="currentColor"/>',
    send:'<path d="M21.5 3 2.5 10.2l7.2 3.1 3.2 7.7z"/><path d="m21.5 3-11.8 10.3"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.5-4.5"/>',
    heart:'<path d="M12 20.7s-8.7-5.1-8.7-11.3A4.9 4.9 0 0 1 12 6.5a4.9 4.9 0 0 1 8.7 2.9c0 6.2-8.7 11.3-8.7 11.3z"/>',
    comment:'<path d="M3 20.7l1.5-4.4A8.8 8.8 0 1 1 8 19.6z"/>',
    bookmark:'<path d="M6 3h12v18l-6-4.6L6 21z"/>',
    plusbox:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>',
    more:'<circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/>',
    back:'<path d="m15 4-8 8 8 8"/>',
    camera:'<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
    phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"/>',
    video:'<rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 10 5-3v10l-5-3z"/>',
    mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
    image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.7"/><path d="m4 18 5-5 4 4 3-3 4 4"/>',
    smile:'<circle cx="12" cy="12" r="9"/><path d="M8.5 14a4 4 0 0 0 7 0M9 9.5v.1M15 9.5v.1"/>',
    close:'<path d="M6 6l12 12M18 6 6 18"/>',
    chev:'<path d="m6 9 6 6 6-6"/>',
    grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    ig:'<rect x="3" y="3" width="18" height="18" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r=".9" fill="currentColor"/>',
    lock:'<rect x="5" y="11" width="14" height="10" rx="2.5" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
    bolt:'<path d="M9 3h6l-1.5 7H17l-6 11 1-8H8z"/>',
    compass:'<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z" fill="currentColor"/>',
    note:'<path d="M5 3h10l4 4v14H5z"/><path d="M8 11h8M8 15h6"/>',
    music:'<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
    gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'
  };
  const ic=(n,s,w,f)=>`<svg viewBox="0 0 24 24" width="${s||24}" height="${s||24}" fill="${f||'none'}" stroke="currentColor" stroke-width="${w||1.8}" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
  const A=id=>id==='me'?cfg.me:cfg.accounts.find(a=>a.id===id);
  const T=()=>{let h,m;const x=/(\d{1,2})\s*[:：]\s*(\d{2})/.exec(cfg.time||'');if(x){h=+x[1]%24;m=+x[2]%60}else{const d=new Date();h=d.getHours();m=d.getMinutes()}return{h,m}};
  const clk=()=>{const t=T();return(t.h%12||12)+':'+String(t.m).padStart(2,'0')};
  const ampm=()=>T().h<12?'오전':'오후';
  const lines=t=>String(t||'').split('\n').map(s=>s.trim()).filter(Boolean);
  const parseOne=(raw='')=>{
    const s=String(raw||'').trim();
    if(!s) return null;
    let body=s, time=null;
    const m=s.match(/^(\d{4}[-/]\d{1,2}[-/]\d{1,2}\s+\d{1,2}:\d{2})\s*[|/:-]?\s*(.*)$/);
    if(m){time=m[1].replace(/\//g,'-'); body=m[2].trim();} else {
      const m2=s.match(/^(\d{4}[-/]\d{1,2}[-/]\d{1,2})\s+(\d{1,2}:\d{2})\s*[|/:-]?\s*(.*)$/);
      if(m2){time=m2[1]+' '+m2[2]; body=m2[3].trim();}
    }
    const isMine = body.startsWith('>');
    if(isMine) body = body.slice(1).trim();
    if(!body) return null;
    return {f:isMine?'mine':'them', t:body, time: time || null};
  };
  const parseThread=t=>{
    const out=[]; for(const line of lines(t)){const x=parseOne(line); if(x) out.push(x)}
    return out.length ? out : lines(t).map(s=>({f:s.startsWith('>')?'mine':'them', t:s.replace(/^>/,'').trim(), time:null})).filter(x=>x.t);
  };
  const msgs=a=>parseThread(a.dm).concat(S.extra[a.id]||[]);
  const cfgLastThem=a=>{const p=parseThread(a.dm);return p.length>0&&p[p.length-1].f==='them'};
  const isUnr=a=>S.unr[a.id]!==undefined?S.unr[a.id]:cfgLastThem(a);
  const unrCount=()=>cfg.accounts.filter(isUnr).length;
  const hs=s=>[...String(s)].reduce((x,c)=>x+c.charCodeAt(0),0);
  const hasSt=a=>a.stories&&a.stories.length>0;
  const wallStyle=()=>cfg.wallpaper?`background-image:url('${U(cfg.wallpaper)}')`:'';
  const view=()=>S.stack.length?S.stack[S.stack.length-1]:{t:'tab'};
  const rd=a=>a.read==='y'?true:a.read==='n'?false:parseThread(a.dm).length>0 && parseThread(a.dm)[parseThread(a.dm).length-1].f==='mine' && !S.typing;
  const memosList=()=>S.mem||(S.mem=(cfg.memos||[]).map(m=>Object.assign({},m)));
  const smsMsgs=c=>parseThread(c.thread).concat(S.sx[c.id]||[]);

  const sb=()=>`<div class="sb"><span class="tclk">${clk()}</span><span class="r"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8"/><rect x="10" y="3" width="3" height="9" rx=".8"/><rect x="15" y="0" width="3" height="12" rx=".8"/></svg><svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M1 4.2a10 10 0 0 1 15 0M3.5 7a6.5 6.5 0 0 1 10 0"/><circle cx="8.5" cy="10" r="1.2" fill="currentColor" stroke="none"/></svg><svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.5-1.2 1.5-2s-.7-1.7-1.5-2z" fill="currentColor" opacity=".5"/></svg></span></div>`;
  const ring=(a,cls)=>{const has=hasSt(a);return `<span class="ring ${cls||''} ${has?(S.seen[a.id]?'seen':''):'none'}"><img src="${esc(U(a.avatar))}" alt=""></span>`};

  function lock(){
    const a=cfg.notifyOn!==false?cfg.accounts.find(x=>isUnr(x)&&msgs(x).length):null;
    const m=a?(msgs(a).filter(x=>x.f==='them').pop()||{}).t:'';
    const d=new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});
    return `<div class="wall" style="${wallStyle()}"></div><div class="shade"></div>${sb()}
    <div class="lk-ic">${ic('lock',20,2)}</div>
    <div class="lk-top"><div class="lk-date">${d}</div><div class="lk-time tclk">${clk()}</div></div>
    ${a?`<div class="notif" data-a="unlock"><span class="n-ic">${ic('ig',22,2)}</span><span class="n-tx"><b>${esc(a.username)}</b><span>${esc(m)}</span></span><small>지금</small></div>`:''}
    <div class="lk-btns"><button class="rb" data-a="toast" data-m="손전등을 사용할 수 없어요">${ic('bolt',22)}</button><button class="rb" data-a="toast" data-m="카메라를 사용할 수 없어요">${ic('camera',22)}</button></div>
    <div class="hint">위로 쓸어올려서 잠금 해제</div><div class="hb" data-a="unlock"></div>`;
  }
  function pass(){
    const L=Math.max(1,String(cfg.passcode||'0000').length);
    const sub={2:'ABC',3:'DEF',4:'GHI',5:'JKL',6:'MNO',7:'PQRS',8:'TUV',9:'WXYZ'};
    const key=n=>`<button class="k" data-a="key" data-k="${n}"><b>${n}</b><small>${sub[n]||''}</small></button>`;
    return `<div class="wall" style="${wallStyle()}"></div><div class="blur"></div>${sb()}
    <div class="pw"><div class="pt">암호 입력</div>
    <div class="dots ${S.shake?'shake':''}">${Array.from({length:L}).map((_,i)=>`<i class="${S.pin.length>i?'on':''}"></i>`).join('')}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(key).join('')}<span></span>${key(0)}<span></span></div></div>
    <div class="pb"><button data-a="toast" data-m="긴급 전화를 사용할 수 없어요">긴급상황</button><button data-a="${S.pin?'del':'cancel'}">${S.pin?'삭제':'취소'}</button></div><div class="hb"></div>`;
  }
  function home(){
    const d=new Date(),wd=d.toLocaleDateString('ko-KR',{weekday:'long'}),n=unrCount();
    const ap=(nm,bg,inner)=>`<button class="app" data-a="toast" data-m="미리보기에서는 사용할 수 없는 앱이에요"><span class="ia" style="background:${bg}">${inner}</span><span class="al">${nm}</span></button>`;
    const ap2=(a,nm,bg,inner)=>`<button class="app" data-a="${a}"><span class="ia" style="background:${bg}">${inner}</span><span class="al">${nm}</span></button>`;

  d.innerHTML='<div style="background:light-dark(#fff,#2a2733);border-radius:16px;padding:18px;max-width:420px;width:100%;font-size:14px"><div id="lkm" style="line-height:1.5;margin-bottom:10px"></div><input id="lki" type="text" readonly style="display:none;width:100%;padding:10px;border-radius:10px;border:1px solid #8886;background:transparent;color:inherit"><button id="lkc" class="primary" style="display:none">링크 복사</button><button id="lkx" class="secondary">닫기</button></div>';
  document.body.appendChild(d);
  const m=d.querySelector('#lkm'),i=d.querySelector('#lki'),c=d.querySelector('#lkc');m.textContent=msg;d.querySelector('#lkx').onclick=()=>d.remove();
  return{set(t){m.textContent=t},link(l){m.textContent='독자용 링크가 만들어졌어요. 이 링크를 독자에게 보내세요.';i.value=l;i.style.display='block';i.select();c.style.display='block';c.onclick=()=>{i.select();try{navigator.clipboard.writeText(l).then(()=>{c.textContent='복사됨!'})}catch(e){document.execCommand('copy');c.textContent='복사됨!'}}}}
}
async function makeLink(){
  const box=openBox('링크를 만드는 중이에요...');
  try{
    const as=window.claude&&await window.claude.use('assets');
    if(!as){box.set('이 환경에서는 링크를 만들 수 없어요. 이 페이지를 만든 계정(편집 권한)으로 열어 주세요.');return}
    const r=await as.upload(new Blob([JSON.stringify(cfg)],{type:'application/json'}));
    box.link(ARTIFACT_URL+'#'+r.id);
  }catch(e){box.set('링크를 만들지 못했어요: '+((e&&e.message)||'알 수 없는 오류'))}
}
function norm(c){c.explore=c.explore||[];c.gallery=c.gallery||[];c.memos=c.memos||[];c.sms=c.sms||[];if(c.autoSec===undefined)c.autoSec=8;return c}

const phone=mountPhone(document.getElementById('scr'),cfg);
if(RID){document.body.classList.add('reader');fetch('/_blob/'+RID).then(r=>r.json()).then(c=>{cfg=norm(c);phone.update(cfg)}).catch(()=>{})}

const fit=()=>fitDevice(dev,RID?8:18,!!RID);addEventListener('resize',fit);fit();

function loadImg(file,max,sq){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sd=sq?Math.min(im.width,im.height):0,sx=sq?(im.width-sd)/2:0,sy=sq?(im.height-sd)/2:0,sw=sq?sd:im.width,sh=sq?sd:im.height,k=Math.min(1,(max||1080)/Math.max(sw,sh)),c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);const x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,c.width,c.height);x.drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.86))};im.onerror=()=>res(r.result);im.src=r.result};r.readAsDataURL(file)})}
const bld=document.getElementById('bld');
bld.addEventListener('input',e=>{const t=e.target;if(!t.dataset.bind)return;if(t.dataset.bind==='passcode'){t.value=t.value.replace(/\D/g,'').slice(0,6)}setPath(t.dataset.bind,t.value);updSoon()});
bld.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.det){d.open?open.add(d.dataset.det):open.delete(d.dataset.det)}},true);
bld.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.bindc){cfg[t.dataset.bindc]=t.checked;upd();return}
  if(t.dataset.img&&t.files[0]){setPath(t.dataset.img,await loadImg(t.files[0],t.dataset.img==='wallpaper'?1600:/avatar$/.test(t.dataset.img)?600:1080,/avatar$/.test(t.dataset.img)?1:0));renderBuilder();upd()}
  if(t.dataset.imgs&&t.files.length){const arr=getPath(t.dataset.imgs);for(const f of t.files)arr.push(await loadImg(f,1080));renderBuilder();upd()}
});
function download(name,blob){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function exportReader(){
  const css=document.getElementById('phoneCss').textContent;
  const data=JSON.stringify(cfg).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  const html='<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Interactive Fiction</title><style>'+css+'html,body{margin:0;height:100%;background:#d9d8de;overscroll-behavior:none}body{display:flex;justify-content:center;align-items:center;overflow:hidden}.stage{width:100vw;height:100vh;height:100dvh;display:flex;justify-content:center;align-items:center;overflow:hidden}</style></head><body><div class="stage"><div class="device" id="dev"><div class="island"></div><div id="scr"></div></div></div><script>const CFG='+data+';'+mountPhone.toString()+';'+fitDevice.toString()+';mountPhone(document.getElementById("scr"),CFG);const dv=document.getElementById("dev");const ft=()=>fitDevice(dv,18,true);addEventListener("resize",ft);ft();<\/script></body></html>';
  download('독자용_인터랙티브_스토리.html',new Blob([html],{type:'text/html;charset=utf-8'}));
}
async function exportSite(){
  const css=document.getElementById('phoneCss').textContent;
  const siteHtml='<!doctype html>\n<html lang="ko">\n<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n  <title>Interactive Fiction</title>\n  <style>'+css+'html,body{margin:0;height:100%;background:#d9d8de;overscroll-behavior:none}body{display:flex;justify-content:center;align-items:center;overflow:hidden}.stage{width:100vw;height:100vh;height:100dvh;display:flex;justify-content:center;align-items:center;overflow:hidden}</style>\n</head>\n<body>\n  <div class=\"stage\">\n    <div class=\"device\" id=\"dev\"><div class=\"island\"></div><div id=\"scr\"></div></div>\n  </div>\n  <script>\n    const CFG_URL = \"config.json\";\n    const loadCfg = async () => {\n      const res = await fetch(CFG_URL, { cache: \"no-store\" });\n      if (!res.ok) throw new Error(\"config.json 로드 실패\");\n      return await res.json();\n    };\n    const boot = async () => {\n      const CFG = await loadCfg();\n      ' + mountPhone.toString() + '\n      ' + fitDevice.toString() + '\n      mountPhone(document.getElementById(\"scr\"), CFG);\n      const dv = document.getElementById(\"dev\");\n      const ft = () => fitDevice(dv, 18, true);\n      addEventListener(\"resize\", ft); ft();\n    };\n    boot();\n  <\\/script>\n</body>\n</html>';
  try {
    const jszipScript = document.createElement('script');
    jszipScript.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
    jszipScript.onload = () => {
      const zip = new JSZip();
      zip.file('index.html', siteHtml);
      zip.file('config.json', JSON.stringify(cfg));
      zip.generateAsync({ type: 'blob' }).then(blob => download('interactive-fiction-site.zip', blob));
    };
    jszipScript.onerror = () => {
      alert('사이트용 ZIP 생성에 필요한 라이브러리를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.');
    };
    document.body.appendChild(jszipScript);
  } catch (e) {
    alert('사이트용 ZIP 생성 중 오류가 발생했어요: ' + (e && e.message ? e.message : e));
  }
}
bld.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-act],[data-rm],[data-add]');if(!t)return;
  if(t.dataset.rm){const arr=getPath(t.dataset.rm);arr.splice(+t.dataset.i,1);renderBuilder();upd();return}
  if(t.dataset.add==='post'){getPath(t.dataset.base+'.posts').push(newPost());renderBuilder();upd();return}
  const a=t.dataset.act;if(!a)return;
  if(a==='delAcc'){e.preventDefault();if(confirm('이 계정을 삭제할까요?')){cfg.accounts.splice(+t.dataset.i,1);renderBuilder();upd()}}
  else if(a==='addAcc'){const id=uid();open.add(id);cfg.accounts.push({id,username:'new_user',name:'새 친구',bio:'',note:'',avatar:sil('#9ec5f0'),stories:[sty('#89f7fe','#66a6ff','✨')],posts:[newPost()],dm:'2026-10-23 18:00 | 안녕!',replyText:'2026-10-23 18:10 | ㅋㅋ 그러게',dmAgo:'방금'});renderBuilder();upd()}
  else if(a==='addMemo'){cfg.memos.push({title:'새 메모',body:'',date:'오늘'});renderBuilder();upd()}
  else if(a==='addSms'){cfg.sms.push({id:uid(),name:'새 연락처',date:'오늘',time:'',thread:'2026-10-23 18:00 | 안녕!',reply:'2026-10-23 18:05 | 반가워'});renderBuilder();upd()}
  else if(a==='exportLink')makeLink();
  else if(a==='export')exportReader();
  else if(a==='exportSite')exportSite();
  else if(a==='restart'){phone.restart()}
  else if(a==='exportJson')download('interactive-fiction-project.json',new Blob([JSON.stringify(cfg)],{type:'application/json'}));
  else if(a==='importJson')document.getElementById('jsonIn').click();
  else if(a==='reset'){if(confirm('모든 설정이 예시 데이터로 바뀌어요. 계속할까요?')){cfg=defaultCfg();renderBuilder();upd()}}
});
document.getElementById('jsonIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const c=JSON.parse(r.result);if(!c.me||!c.accounts)throw 0;cfg=norm(c);renderBuilder();upd()}catch(x){alert('불러올 수 없는 파일이에요.')}};r.readAsText(f);e.target.value=''});
renderBuilder();
</script>
